[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# X Layer mainnet (chain 196). Cancun is the conservative target used by other X Layer TapeOut projects.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
# Tests read the generated netlists so the contracts and the circuit generator share one artifact.
fs_permissions = [
    { access = "read", path = "../circuits/daily-cap/build" },
    { access = "read", path = "../circuits/payee-whitelist/build" },
    { access = "read", path = "../circuits/confirmation/build" },
    { access = "read", path = "../circuits/freeze/build" },
]

[profile.default.fuzz]
runs = 512

[rpc_endpoints]
xlayer = "https://rpc.xlayer.tech"

[fmt]
line_length = 120
